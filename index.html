<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joud Key</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050805;
    font-family: Arial, sans-serif;
    color: white;
}

.box {
    width: 90%;
    max-width: 380px;
    padding: 30px 22px;
    background: #0d160f;
    border: 2px solid #00ff66;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,255,100,.25);
}

h1 {
    margin: 0 0 10px;
    color: #00ff66;
    font-size: 30px;
}

p {
    color: #b8c8bc;
    font-size: 15px;
}

.info {
    margin: 20px 0;
    padding: 12px;
    border-radius: 10px;
    background: #142119;
    color: #00ff66;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #00d957;
    color: #001b09;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#key {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 10px;
    background: #050805;
    border: 1px solid #00ff66;
    color: #00ff66;
    word-break: break-all;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="box">

    <h1>Joud Key</h1>

    <p>مفتاح Joud Script</p>

    <div class="info">
        صلاحية المفتاح: 23 ساعة
    </div>

    <button onclick="getKey()">
        الحصول على المفتاح
    </button>

    <div id="key">
        FREE_1413cdf7704463a2b79aaaad2961185d
    </div>

</div>

<script>
function getKey() {
    document.getElementById("key").style.display = "block";
}
</script>

</body>
</html>
